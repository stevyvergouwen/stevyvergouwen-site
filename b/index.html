<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08080a">
<link rel="preconnect" href="https://aanvraag-stevyvergouwen.polished-shape-ff19.workers.dev">
<title>Briefing | Stevy Vergouwen</title>
<link rel="stylesheet" href="/fonts.css">
<style>
:root{--ink:#08080a;--ink2:#111114;--paper:#ebe7e0;--dim:#a09e99;--faint:#2c2b29;--line:rgba(235,231,224,.22);--blue:#5b84ff;--pad:clamp(16px,3.4vw,48px);--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:"Roboto Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html{background:var(--ink);color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--paper);font:13px/1.65 var(--mono);letter-spacing:.03em;-webkit-font-smoothing:antialiased}
::selection{background:var(--blue);color:var(--ink)}
a{color:inherit}
.bar{display:flex;justify-content:space-between;padding:18px var(--pad);font-size:11px;letter-spacing:.22em;text-transform:uppercase;position:relative;z-index:3}
.hero{position:relative;overflow:hidden;margin-top:-52px;padding:110px var(--pad) 44px;background:var(--ink2) center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,8,10,.55),rgba(8,8,10,.35) 45%,var(--ink))}
.hero>*{position:relative}
.eyebrow{color:var(--blue);letter-spacing:.22em;text-transform:uppercase;font-size:11px}
h1{margin:10px 0 16px;font:700 clamp(2.6rem,9vw,6rem)/.95 var(--sans);letter-spacing:-.045em;text-wrap:balance}
.meta{display:flex;gap:8px 26px;flex-wrap:wrap;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
main{max-width:1000px;margin:0 auto;padding:10px var(--pad) 90px}
section{padding:34px 0;border-top:1px solid var(--faint)}section:first-child{border-top:0}
h2{margin:0 0 16px;font:700 1.5rem/1.1 var(--sans);letter-spacing:-.02em;display:flex;gap:10px;align-items:baseline}h2 small{font:400 10px var(--mono);color:var(--blue);letter-spacing:.1em}
.lab{color:var(--dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media (max-width:720px){.two{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:96px 1fr;gap:9px 16px;font-size:13px}.kv .lab{padding-top:3px}.kv b{font-weight:700}
.tt{display:grid;grid-template-columns:96px 1fr;gap:6px 16px}.tt b{font-weight:700}
.cont{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}@media (max-width:480px){.cont{grid-template-columns:1fr}}
.c b{display:block;font:700 14px var(--sans);letter-spacing:0;margin-top:2px}.c a{color:var(--dim);text-decoration:none;display:block;overflow-wrap:anywhere}.c a:hover{color:var(--paper)}
p.txt{max-width:64ch;font:15px/1.7 var(--sans);letter-spacing:0;margin:0;text-wrap:pretty;white-space:pre-line}
.box{border:2px solid var(--faint);border-radius:4px;padding:18px 20px}.box .lab{color:var(--blue);margin-bottom:10px}
ul{margin:0;padding:0;list-style:none}li{position:relative;padding-left:16px;margin:6px 0;font:14px/1.5 var(--sans);letter-spacing:0}li::before{content:"";position:absolute;left:0;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.imp{border-color:var(--blue)}
.cam{border-top:1px solid var(--faint);padding:16px 0;display:grid;grid-template-columns:44px 1fr;gap:6px 14px}
.cam .l{font:700 1.7rem var(--sans);color:var(--blue);letter-spacing:-.02em}.cam .pos{font:700 15px var(--sans);letter-spacing:0}.cam .g{color:var(--dim);font-size:12px;margin-top:2px}.cam .w{font:14px/1.5 var(--sans);letter-spacing:0;margin-top:6px}
.cam .who{display:inline-block;margin-top:8px;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.photos figure{margin:0}.photos img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;border-radius:3px;background:var(--ink2)}.photos figcaption{color:var(--dim);font-size:11px;margin-top:6px}
.btn{display:inline-block;border:1px solid var(--paper);background:var(--paper);color:var(--ink);border-radius:999px;padding:12px 22px;text-decoration:none;letter-spacing:.16em;text-transform:uppercase;font-size:11px}
.btn.o{background:none;color:var(--paper);border-color:var(--line)}
.inv{color:var(--dim);font-size:12px;display:grid;gap:3px}
footer{padding:26px var(--pad) 50px;color:var(--dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
.gone{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}.gone h1{font-size:2.4rem}
@media print{.bar{display:none}.hero{margin-top:0}}
</style>
</head>
<body>
<div class="bar"><span>Stevy Vergouwen</span><span>Production briefing</span></div>
<div id="app"></div>
<footer>stevyvergouwen.com</footer>
<script>
const ENDPOINT = "https://aanvraag-stevyvergouwen.polished-shape-ff19.workers.dev";
const app = document.getElementById("app"), q = new URLSearchParams(location.search), slug = (q.get("c") || "").toLowerCase();
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lines = t => String(t || "").split("\n").map(x => x.trim()).filter(Boolean);
const ul = t => lines(t).length ? `<ul>${lines(t).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
const link = (href, text) => /^https:\/\//.test(href) ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text || href)}</a>` : esc(text || href);
const kv = (l, v) => v ? `<div class="lab">${l}</div><div><b>${esc(v)}</b></div>` : "";
function gone(msg) { app.innerHTML = `<div class="gone"><div><div class="eyebrow">Stevy Vergouwen</div><h1>Briefing</h1><p style="color:var(--dim)">${esc(msg)}</p></div></div>`; }
async function load() {
  if (!/^[a-z0-9]{10,40}$/.test(slug)) return gone("This link is not complete. Ask Stevy for the link again.");
  let r; try { r = await fetch(`${ENDPOINT}/brief/${slug}`); } catch { return gone("No connection. Try again."); }
  if (r.status === 404) return gone("This briefing is not available (anymore). Ask Stevy for the latest link.");
  if (!r.ok) return gone("Something went wrong. Try again in a minute.");
  draw(await r.json());
}
function draw(d) {
  document.title = `${d.title || "Briefing"} | Stevy Vergouwen`;
  const cover = (d.photos || []).find(p => p.id === d.cover) || (d.photos || [])[0];
  const img = id => `${ENDPOINT}/brief-img/${slug}/${id}`;
  let n = 0; const nr = () => String(++n).padStart(2, "0");
  const contacts = (d.contacts || []).map(c => `<div class="c"><span class="lab">${esc(c.role)}</span><b>${esc(c.name)}</b>${c.phone ? `<a href="tel:${esc(c.phone.replace(/[^+\d]/g, ""))}">${esc(c.phone)}</a>` : ""}${c.mail ? `<a href="mailto:${esc(c.mail)}">${esc(c.mail)}</a>` : ""}</div>`).join("");
  const cams = (d.cams || []).map(c => `<div class="cam"><div class="l">${esc(c.cam.length === 1 ? c.cam : "")}</div><div><div class="pos">${esc(c.cam.length === 1 ? c.position : c.cam + (c.position ? " · " + c.position : ""))}</div>${[c.camera, c.lens, c.mount, c.power].filter(Boolean).length ? `<div class="g">${esc([c.camera, c.lens, c.mount, c.power].filter(Boolean).join(" · "))}</div>` : ""}${c.coverage ? `<div class="w">${esc(c.coverage)}</div>` : ""}${c.operator ? `<span class="who">${esc(c.operator)}</span>` : ""}</div></div>`).join("");
  app.innerHTML = `
  <div class="hero"${cover ? ` style="background-image:url('${img(cover.id)}')"` : ""}>
    <div class="eyebrow">${esc(d.kind || "Production briefing")}</div><h1>${esc(d.title)}</h1>
    <div class="meta">${[d.dateShort, d.place, d.client].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}</div>
  </div>
  <main>
    <section><div class="two">
      <div><h2><small>${nr()}</small>Production details</h2><div class="kv">${kv("Client", d.client)}${kv("Date", d.date)}${kv("Location", d.place)}${kv("Event time", d.eventTime)}${kv("Call time", d.callTime)}</div>
        ${(d.timetable || []).length ? `<div class="lab" style="margin:22px 0 8px">Line-up</div><div class="tt">${d.timetable.map(t => `<b>${esc(t.time)}</b><span>${esc(t.what)}${t.who ? ` <em style="color:var(--blue);font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase">· ${esc(t.who)}</em>` : ""}</span>`).join("")}</div>` : ""}</div>
      <div><h2><small>${nr()}</small>Contact</h2><div class="cont">${contacts}</div></div>
    </div></section>
    <section><h2><small>${nr()}</small>Project overview</h2><p class="txt">${esc(d.overview)}</p>
      ${d.important ? `<div class="box imp" style="margin-top:20px"><div class="lab">Important</div>${ul(d.important)}</div>` : ""}
      <div class="two" style="margin-top:20px;gap:16px">${d.deliverables ? `<div class="box"><div class="lab">Deliverables</div>${ul(d.deliverables)}</div>` : ""}${d.delivery || d.dropLink ? `<div class="box"><div class="lab">Delivery</div>${ul(d.delivery)}${d.dropLink ? `<p style="margin:14px 0 0"><a class="btn" href="${esc(d.dropLink)}" target="_blank" rel="noopener">Upload your footage</a></p>${d.dropCode ? `<p class="lab" style="margin-top:10px">Code: <span style="color:var(--paper)">${esc(d.dropCode)}</span></p>` : ""}` : ""}</div>` : ""}</div></section>
    ${cams ? `<section><h2><small>${nr()}</small>Camera angles</h2>${cams}</section>` : ""}
    ${d.audio ? `<section><h2><small>${nr()}</small>Audio</h2><p class="txt">${esc(d.audio)}</p></section>` : ""}
    ${(d.photos || []).length || d.photography ? `<section><h2><small>${nr()}</small>Photography and vibe</h2>${d.photography ? (lines(d.photography).length > 1 ? `<div class="box imp" style="margin-bottom:22px"><div class="lab">What matters for the photos</div>${ul(d.photography)}</div>` : `<p class="txt" style="margin-bottom:22px">${esc(d.photography)}</p>`) : ""}<div class="photos">${(d.photos || []).map(p => `<figure><a href="${img(p.id)}" target="_blank" rel="noopener"><img loading="lazy" src="${img(p.id)}" alt="${esc(p.note || "Reference photo")}"></a>${p.note ? `<figcaption>${esc(p.note)}</figcaption>` : ""}</figure>`).join("")}</div></section>` : ""}
    ${d.access || d.requirements || d.questions ? `<section><h2><small>${nr()}</small>Production requirements</h2><div class="two">
      <div>${d.access ? `<div class="lab" style="margin-bottom:6px">Access</div>${ul(d.access)}` : ""}${d.questions ? `<div class="lab" style="margin:20px 0 6px">Open questions</div>${ul(d.questions)}` : ""}</div>
      <div>${d.requirements ? `<div class="lab" style="margin-bottom:6px">Technical</div>${ul(d.requirements)}` : ""}</div></div></section>` : ""}
    ${d.invoicing ? `<section><div class="lab" style="margin-bottom:8px">Invoicing</div><div class="inv"><span>Stevy Vergouwen, Haagweg 29A, 4814 GB Breda</span><span>info@stevyvergouwen.com · +31 6 10172579</span><span>KVK 91512840 · Btw NL004384784B12 · NL13 RABO 0380 9841 99</span><span style="margin-top:8px;color:var(--paper)">Please send your invoice as soon as possible after the event, including travel costs (km) and parking costs (with the receipt).</span></div></section>` : ""}
  </main>`;
}
load();
</script>
</body>
</html>
