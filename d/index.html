/* title flicker, as on stevyvergouwen.com: each letter blinks on and off a few times at its own moment, then stays on */
function flickerTitle(el) {
  if (!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const txt = el.textContent.trim(); if (txt.length < 2) return;
  el.setAttribute("aria-label", txt); el.textContent = ""; const letters = [];
  txt.split(" ").forEach((word, wi, all) => {
    const w = document.createElement("span"); w.style.cssText = "display:inline-block;white-space:nowrap"; w.setAttribute("aria-hidden", "true");
    [...word].forEach(ch => { const s = document.createElement("span"); s.textContent = ch; s.style.opacity = "0"; w.appendChild(s); letters.push(s); });
    el.appendChild(w); if (wi < all.length - 1) el.appendChild(document.createTextNode(" "));
  });
  letters.forEach(c => { let t = 150 + Math.random() * 1100; const n = 2 + Math.floor(Math.random() * 3);
    for (let k = 0; k < n; k++) { setTimeout(() => c.style.opacity = "1", t); t += 35 + Math.random() * 70; setTimeout(() => c.style.opacity = "0", t); t += 40 + Math.random() * 110; }
    setTimeout(() => c.style.opacity = "1", t); });
  setTimeout(() => letters.forEach(c => c.style.opacity = "1"), 2600);
}
/* a dimmed looping video behind the title: a file called banner/header/loop/hero if there is one, else the smallest landscape clip under 160 MB */

    const V = M.videos || []; if (!V.length) return;
    const phone = matchMedia("(max-width: 760px)").matches, want = phone ? "9:16" : "16:9";   // a phone gets vertical clips, once they are delivered
    const named = V.filter(v => /(^|[^a-z])(banner|header|loop|hero)([^a-z]|$)/i.test(v.name || "")).filter(v => { const vert = /(vertical|9x16|mobile|phone)/i.test(v.name || "") || vinfo(v).fmt === "9:16"; return phone ? vert : !vert; });
    let list = named.slice(0, 6);

      const by = {}; V.forEach(v => { const x = vinfo(v); if (x.fmt === want && v.size && v.size < 160e6 && x.res !== "4K") { (by[x.artist] = by[x.artist] || []).push(v); } });
      list = Object.values(by).map(a => a.sort((p, q) => p.size - q.size)[0]).sort(() => Math.random() - .5).slice(0, 5);

      const any = V.filter(v => v.size && v.size < 400e6).sort((p, q) => rank(vinfo(p).fmt) - rank(vinfo(q).fmt) || p.size - q.size);
      list = any.slice(0, (M.scope || !(M.photos || []).length) ? 3 : 0);   // a delivery of clips only has no photo for a banner: a few of its own clips are cropped to fit
    }

    const mk = () => { const v = document.createElement("video"); v.className = "hv"; v.muted = true; v.playsInline = true; v.preload = "metadata"; v.disableRemotePlayback = true; v.setAttribute("aria-hidden", "true"); hero.insertBefore(v, hero.querySelector(".in")); return v; };
    const vs = [mk(), mk()]; let cur = 0, n = 0, timer = null;

    const next = async () => {

    mark(bar); const tg = host.querySelector(".tg"); tg ? host.insertBefore(bar, tg) : host.appendChild(bar);
  };
  new MutationObserver(() => build()).observe(document.getElementById("app") || document.body, { childList: true, subtree: true }); build();
})();
</script>
<script>
/* a group that has the same name as its folder shows one fold, not two */
(() => {
  const flat = () => document.querySelectorAll(".art").forEach(a => {
    const fgs = a.querySelectorAll(".fg"); if (fgs.length !== 1) return;
    const name = (a.querySelector(".an") || {}).textContent, g = fgs[0], t = (g.querySelector("summary b") || {}).textContent;
    if (name && t && name.trim().toLowerCase() === t.trim().toLowerCase()) { g.open = true; g.classList.add("flat"); }
  });
  new MutationObserver(() => flat()).observe(document.getElementById("app") || document.body, { childList: true, subtree: true }); flat();
})();
</script>
<script>
/* SCROLLFX */
(() => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const hero = () => document.querySelector(".hero");
  let tick = false;
  const upd = () => { tick = false; const h = hero(); if (!h) return; const y = scrollY, H = h.offsetHeight || 1, k = Math.min(1, y / H);
    const bg = h.querySelector(".bg"), hv = h.querySelectorAll(".hv"), inn = h.querySelector(".in");
    if (y < H * 1.3) { h.querySelectorAll(".bg,.hv").forEach(e => { e.style.translate = "0 " + (y * .32).toFixed(1) + "px"; }); if (inn) { inn.style.translate = "0 " + (-y * .18).toFixed(1) + "px"; inn.style.opacity = String(Math.max(0, 1 - k * 1.5)); } }
    document.querySelectorAll(".vgrid .vcard.in, .pgrid .ph.in").forEach(c => { const r = c.getBoundingClientRect(); if (r.bottom < -200 || r.top > innerHeight + 200) return; const m = (r.top + r.height / 2 - innerHeight / 2) / innerHeight, sp = +(c.dataset.sp || 0); c.style.translate = "0 " + (m * sp * -34).toFixed(1) + "px"; }); };
  addEventListener("scroll", () => { if (!tick) { tick = true; requestAnimationFrame(upd); } }, { passive: true });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px", threshold: .05 });
  const mark = () => {
    document.querySelectorAll("h2, .sh, .tgh").forEach(e => { if (e.__sfx || e.closest(".hero,.gate")) return; e.__sfx = 1; e.classList.add("sfx", "l"); io.observe(e); });
    document.querySelectorAll(".vgrid").forEach(g => [...g.children].forEach((c, i) => { if (c.__sfx) return; c.__sfx = 1; c.classList.add("sfx"); c.style.setProperty("--k", i % 6); c.dataset.sp = String([.4, 1, .7][i % 3]); io.observe(c); }));
    document.querySelectorAll(".ph:not(.sfx)").forEach((c, i) => { if (c.__sfx || c.closest(".vgrid")) return; c.__sfx = 1; c.classList.add("sfx"); c.style.setProperty("--d", (i % 5) * 0.06 + "s"); io.observe(c); });
  };
  new MutationObserver(() => { clearTimeout(mark.t); mark.t = setTimeout(mark, 120); }).observe(document.getElementById("app") || document.body, { childList: true, subtree: true });
  mark(); upd();
})();
</script>
