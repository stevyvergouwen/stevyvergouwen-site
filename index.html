<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stevy Vergouwen</title>
<meta name="description" content="Made for the night. Built for the brand. Visuals for artists, events and brands - Stevy Vergouwen, Breda.">
<style>
  :root { --ink:#08080a; --paper:#ebe7e0; --dim:#8b8880; --blue:#5b84ff; }
  * { box-sizing: border-box; }
  html { background: var(--ink); color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(20px,4vw,48px);
    background:transparent; color:var(--paper); font:13px/1.6 ui-monospace,Menlo,monospace; letter-spacing:.02em; }
  [data-bg] { position: fixed; inset: 0; z-index: -1; background: var(--ink); overflow: hidden; }
  .bg-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; }
  .bg-slide.is-on { opacity: 1; }
  .bg-slide video, .bg-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bg-slide img { transform: scale(1.04); transition: transform 9s linear; }
  .bg-slide.is-on img { transform: scale(1.12); }
  [data-bg]::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(8,8,10,.62), rgba(8,8,10,.78)); }
  @media (prefers-reduced-motion: reduce) { .bg-slide img, .bg-slide.is-on img { transform: none; transition: none; } }
  a { color:inherit; text-decoration:none; }
  a:hover { color:var(--blue); }
  .top, .foot { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .top { color:var(--dim); }
  h1 { margin:0; font:700 clamp(2.8rem,9vw,8rem)/.98 "Helvetica Neue",Helvetica,Arial,sans-serif; letter-spacing:-.04em; }

  h1 span.ln { display: block; overflow: hidden; padding: .05em 0 .12em; margin-bottom: -.1em; }
  h1 .dim { color: var(--dim); }
  h1 .w { display: inline-block; transform-origin: 0 100%; animation: pop .95s cubic-bezier(.34,1.56,.64,1) both; animation-delay: calc(.25s + var(--i) * .085s); }
  @keyframes pop { 0% { opacity: 0; transform: translateY(115%) rotate(7deg) scale(.7); filter: blur(8px); }
                   55% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: none; filter: blur(0); } }
  main p, .top, .foot { animation: rise .9s cubic-bezier(.2,.7,.1,1) both; }
  main p:nth-of-type(1) { animation-delay: 1.15s; } main p:nth-of-type(2) { animation-delay: 1.3s; }
  .top { animation-delay: .1s; } .foot { animation-delay: 1.5s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { h1 .w, main p, .top, .foot { animation: none; } }
  p { margin:24px 0 0; color:var(--dim); }
  .foot { color:var(--dim); }
</style>
<link rel="stylesheet" href="voorwaarden.css">
</head>
<body>
<div data-bg aria-hidden="true"></div>
<div class="top"><span>STEVY VERGOUWEN</span></div>
<main>
  <h1 aria-label="Made for the night. Built for the brand."><span class="ln" aria-hidden="true"><span class="w" style="--i:0">Made</span> <span class="w" style="--i:1">for</span> <span class="w" style="--i:2">the</span> <span class="w" style="--i:3">night.</span></span><span class="ln dim" aria-hidden="true"><span class="w" style="--i:4">Built</span> <span class="w" style="--i:5">for</span> <span class="w" style="--i:6">the</span> <span class="w" style="--i:7">brand.</span></span></h1>
  <p>Visuals for artists, events and brands. Portfolio coming soon.</p>
  <p><a href="mailto:info@shotbystevy.com">info@shotbystevy.com</a> &nbsp;·&nbsp; <a href="https://www.instagram.com/stevyvergouwen" target="_blank" rel="noopener" aria-label="Instagram: @stevyvergouwen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b8880" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:8px"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r=".6" fill="#8b8880"/></svg>Instagram @stevyvergouwen ↗</a></p>
</main>

<script src="voorwaarden.js"></script>
</body>
</html>
